# Kamal deploy — VIEWER service (public, read-only browse/watch UI).
#
#   kamal deploy -c config/deploy.viewer.yml
#
# Reads the SAME MySQL the admin owns and never migrates. The MySQL accessory
# is defined in config/deploy.yml (admin); this config only connects to it.

service: phimtor2-viewer
image: chiengyn/phimtor2-viewer

servers:
  web:
    - <%= ENV["SERVER_IP"] %>   # same host as admin/streamer

proxy:
  ssl: true
  host: <%= ENV["VIEWER_HOST"] %>   # the public site, e.g. yourdomain.com
  app_port: 8082
  healthcheck:
    path: /up

registry:
  server: ghcr.io
  username: chiengyn
  password:
    - KAMAL_REGISTRY_PASSWORD

# Images are built+pushed to GHCR by CI; deploys pull them via
# `kamal deploy -c config/deploy.viewer.yml --skip-push`. Builder is a local
# fallback only (see DEPLOY.md).
builder:
  arch: amd64
  context: ./viewer

env:
  clear:
    VIEWER_PORT: 8082
    # Public origin of the viewer itself — used for canonical / Open Graph /
    # sitemap URLs (SEO). Must match the browser-facing domain.
    VIEWER_PUBLIC_URL: https://<%= ENV["VIEWER_HOST"] %>
    # Support Discord invite link, surfaced in the site header/footer.
    VIEWER_DISCORD_URL: https://discord.gg/PhaE6DgnC
    # Same shared MySQL accessory as admin (named on the kamal network).
    DB_HOST: phimtor2-admin-mysql
    DB_PORT: 3306
    DB_NAME: phimtor
    DB_USER: phimtor
    # The Android TV app, published by CI (.github/workflows/android.yml) into
    # the host directory mounted at /tv below, and served at /tv and
    # /download/phimnet-tv.apk (viewer/tvapk.go). Unset → those routes are off.
    TV_APK_DIR: /tv
    # Downloader short code (registered by hand at aftv.news, pointing at
    # https://<VIEWER_HOST>/tv), shown on the /{locale}/tv-app install guide.
    # Not secret — it is printed on that page. Empty → the guide shows the URL
    # only. Quoted: an all-digit code must stay a string.
    TV_DOWNLOADER_CODE: "<%= ENV['TV_DOWNLOADER_CODE'] %>"
    # Streamer manager (control plane), server-to-server over the kamal network.
    # The viewer adds torrents via the manager, which returns the owning streamer's
    # public URL per prepare for the browser to stream from directly — so there is
    # no static public streamer URL here anymore.
    MANAGER_INTERNAL_URL: http://phimtor2-manager:8083
    # The same subtitle blob store admin writes (shared host volume). Mostly
    # read, but the viewer WRITES here too now: a signed-in visitor can save a
    # subtitle for everyone from the watch page. Both containers run as the same
    # distroless uid, so admin-created directories accept these writes.
    SUBTITLE_STORAGE_BACKEND: local
    SUBTITLE_STORAGE_DIR: /data/subtitles
    # User-contributed subtitles. The API keys below are the SAME ones the admin
    # uses, so they share one upstream account and one daily download quota —
    # which is exactly why these caps exist. Here the quota is reachable by any
    # signed-in visitor rather than a single operator.
    OPENSUBTITLES_USER_AGENT: phimtor2 v1.0
    SUBSOURCE_USER_AGENT: phimtor2 v1.0
    SUBTITLE_SEARCH_PER_HOUR: 30
    SUBTITLE_DOWNLOADS_PER_DAY: 10
    SUBTITLE_DOWNLOADS_GLOBAL_PER_DAY: 150
    # Paid 4K tier. Leave BILLING_EVM_ADDRESS / BILLING_EVM_CHAINS unset to keep
    # billing OFF: /goi and /thanh-toan are then not registered and 4K shows
    # "sắp ra mắt" for everyone, exactly as before billing existed. That is the
    # clean rollback.
    #
    # The receive address is PUBLIC (it is on-chain) but is not committed here,
    # because this repo is public and infra stays out of it — supply it as a repo
    # Variable or via .env, the same way SERVER_IP is.
    #
    # It is also WATCH-ONLY, and that is the security model: an invoice is
    # identified by a unique exact amount, never by a derived address, so no
    # private key, seed or xpub belongs anywhere near this deployment.
    # QUOTE THESE. Kamal parses this file as YAML 1.1, which reads a bare 0x…
    # value as an INTEGER — and every character of an EVM address after "0x" is
    # a valid hex digit, so the whole address silently became its decimal
    # expansion (381816886467293135913673320154258644308764740206) in the
    # container on 2026-09-12. Nothing errored: invoices stored that as pay_to,
    # buyers were shown an unusable string, and the log-topic filter was built
    # from garbage, so scanning looked healthy while crediting nothing.
    BILLING_EVM_ADDRESS: "<%= ENV['BILLING_EVM_ADDRESS'] %>"
    BILLING_EVM_CHAINS: "<%= ENV['BILLING_EVM_CHAINS'] %>"
    BILLING_POLL_INTERVAL_SEC: 30
    BILLING_INVOICE_TTL_MIN: 30
    BILLING_PASS30_USD_CENTS: 200
    BILLING_PASS365_USD_CENTS: 1500
    BILLING_TITLE_USD_CENTS: 100
    BILLING_VND_PER_USD: 26000
  secret:
    - DB_PASSWORD
    - MANAGER_INTERNAL_TOKEN
    # Google sign-in. Drop all three to disable accounts: the /auth routes are
    # then not registered and the header shows no login button, i.e. the
    # anonymous-only site. The OAuth client's "Authorized redirect URI" must be
    # https://<VIEWER_HOST>/auth/google/callback, byte for byte.
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    # Keys the signed session cookie. Rotating it logs every user out — it is the
    # only revocation lever, since there is no sessions table. Not a routine
    # credential rotation.
    - SESSION_SECRET
    # Subtitle providers for the watch page's search panel. Drop BOTH to turn the
    # feature off: the routes are not registered and no panel is rendered, which
    # is the clean rollback. Same values as the admin's entries in deploy.yml.
    - OPENSUBTITLES_API_KEY
    - SUBSOURCE_API_KEY

# Mount the SAME named volume admin writes subtitles to. The viewer reads it and
# also writes user-contributed subtitles into it.
#
# /srv/phimnet-tv is where the Android TV workflow scp's each signed APK and its
# latest.json. READ-ONLY here: the viewer only serves it, and CI (as root over
# SSH) is its only writer. A plain host directory rather than a named volume so
# CI can write it with scp, and so a new app version needs no viewer redeploy.
# Docker creates it on first boot if CI has not run yet (the routes then 404
# until the first release).
volumes:
  - "phimtor2_subtitles:/data"
  - "/srv/phimnet-tv:/tv:ro"
