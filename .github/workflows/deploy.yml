name: Deploy (manual)

# Manual-only CD: this never runs on push. Trigger it from the Actions tab
# ("Run workflow"), picking the branch/tag to deploy and which service(s).
# It pulls the CI-built GHCR image for the chosen commit and runs
# `kamal deploy --skip-push` over SSH — it does not build.
#
# Required repo SECRETS (Settings → Secrets and variables → Actions → Secrets):
#   KAMAL_SSH_PRIVATE_KEY   private key whose public key is authorized on the
#                           server for the Kamal SSH user (root by default)
#   (KAMAL_REGISTRY_PASSWORD is NOT needed here — this workflow logs the host
#    into ghcr with the run-scoped GITHUB_TOKEN. The secret remains only for
#    local `kamal deploy` from a workstation.)
#   ADMIN_PASSWORD, TMDB_API_KEY, OPENSUBTITLES_API_KEY, SUBSOURCE_API_KEY,
#   DB_PASSWORD, MYSQL_ROOT_PASSWORD,
#   MANAGER_REGISTER_TOKEN, MANAGER_INTERNAL_TOKEN
#
# Required repo VARIABLES (same screen → Variables; these aren't secret and the
# configs read them via ERB <%= ENV[...] %>):
#   SERVER_IP, ADMIN_HOST, VIEWER_HOST, MANAGER_HOST, STREAMER1_HOST, STREAMER2_HOST
#
# Preconditions:
#   - The host is already bootstrapped once from a workstation:
#       kamal setup --skip-push   (installs proxy, logs in, boots MySQL)
#   - The image for the deployed commit exists in GHCR (the build workflow ran).

on:
  workflow_dispatch:
    inputs:
      service:
        description: Service(s) to deploy
        type: choice
        default: all
        options: [all, admin, viewer, manager, streamer]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Optional manual approval gate: create a "production" environment in repo
    # settings with required reviewers, and each run will pause for sign-off.
    environment: production
    permissions:
      contents: read
      packages: read          # GITHUB_TOKEN pulls the CI-built image from ghcr
    steps:
      - name: Checkout (the dispatched branch/tag = the commit to deploy)
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}

      - name: Seed known_hosts
        # Unhashed entries (no -H): net-ssh, which Kamal uses, can misreport a
        # hashed known_hosts line as a host-key mismatch.
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan "${{ vars.SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          # Non-secret host config (read by the configs via ERB).
          SERVER_IP: ${{ vars.SERVER_IP }}
          ADMIN_HOST: ${{ vars.ADMIN_HOST }}
          VIEWER_HOST: ${{ vars.VIEWER_HOST }}
          MANAGER_HOST: ${{ vars.MANAGER_HOST }}
          STREAMER1_HOST: ${{ vars.STREAMER1_HOST }}
          STREAMER2_HOST: ${{ vars.STREAMER2_HOST }}
          # Paid 4K tier. Variables, not secrets: a crypto RECEIVE address is
          # public by nature (it is on-chain), and nothing here can spend from it
          # — invoices are matched by a unique exact amount, not by derived
          # addresses, so the deployment holds no key material. Leave both unset
          # to keep billing off.
          BILLING_EVM_ADDRESS: ${{ vars.BILLING_EVM_ADDRESS }}
          BILLING_EVM_CHAINS: ${{ vars.BILLING_EVM_CHAINS }}
          # The aftv.news Downloader code for <VIEWER_HOST>/tv, shown on the TV app
          # install guide. Public (it is printed on that page); unset hides it.
          TV_DOWNLOADER_CODE: ${{ vars.TV_DOWNLOADER_CODE }}
          # Secrets.
          # The host's `docker login ghcr.io` credential. This is the built-in
          # GITHUB_TOKEN, minted fresh for this run and expiring with it, NOT a
          # PAT: a classic PAT here expires silently every 60-90 days and the
          # only symptom is `Get "https://ghcr.io/v2/": denied: denied` at the
          # first step of a deploy, with production left on the old version.
          # Needs the packages:read permission granted on this job (above).
          # The KAMAL_REGISTRY_PASSWORD secret is still required for a LOCAL
          # `kamal deploy` from a workstation, which has no GITHUB_TOKEN — see
          # .kamal/secrets and DEPLOY.md.
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          SUBSOURCE_API_KEY: ${{ secrets.SUBSOURCE_API_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MANAGER_REGISTER_TOKEN: ${{ secrets.MANAGER_REGISTER_TOKEN }}
          MANAGER_INTERNAL_TOKEN: ${{ secrets.MANAGER_INTERNAL_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          set -euo pipefail
          admin()    { kamal deploy --skip-push; }
          viewer()   { kamal deploy -c config/deploy.viewer.yml --skip-push; }
          manager()  { kamal deploy -c config/deploy.manager.yml --skip-push; }
          # Streamer instance 1 is the base config; add instances as destinations,
          # e.g. `kamal deploy -c config/deploy.streamer.yml -d s2 --skip-push`.
          #
          # A streamer holds an EXCLUSIVE lock on the piece-completion DB in its
          # /data volume, so Kamal's rolling deploy (boot new -> health-check ->
          # stop old) can never go green: the new container cannot open the DB
          # while the old one still holds it, and the deploy times out. Stop the
          # old container first, as DEPLOY.md prescribes. That costs a few seconds
          # of downtime for this instance; other instances keep serving.
          streamer() {
            local cfg=config/deploy.streamer.yml
            kamal app stop -c "$cfg" || true   # nothing to stop on a first deploy
            if ! kamal deploy -c "$cfg" --skip-push; then
              echo "::error::Streamer deploy failed AFTER the old container was stopped - this instance is DOWN. Re-run this workflow, or boot a known-good version with: kamal app boot -c $cfg"
              return 1
            fi
          }
          case "${{ inputs.service }}" in
            # admin first (DB + migrations); manager before streamer so it can
            # register on boot.
            all)      admin; manager; streamer; viewer ;;
            admin)    admin ;;
            viewer)   viewer ;;
            manager)  manager ;;
            streamer) streamer ;;
          esac
