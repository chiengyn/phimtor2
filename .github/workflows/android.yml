name: Android TV app

# Builds and tests tv/. It never deploys anything: the TV app is distributed as
# an APK, not run on the server, so Kamal is not involved.
#
#  - Every push / PR touching tv/: unit tests, lint, and a minified release
#    build (R8 problems only show in minified builds).
#  - A tag "tv-v*" (e.g. tv-v0.1.0) additionally SIGNS the release APK and keeps
#    it as a workflow artifact. Deliberately not "v*", which is the Docker
#    workflow's trigger for the Go services.
#
# Signing needs these repo SECRETS (the release is left unsigned without them):
#   PHIMNET_TV_KEYSTORE_B64       base64 of the .jks keystore
#   PHIMNET_TV_KEYSTORE_PASSWORD
#   PHIMNET_TV_KEY_ALIAS
#   PHIMNET_TV_KEY_PASSWORD

on:
  push:
    branches: [main]
    tags: ["tv-v*"]
    paths: ["tv/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["tv/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Android Gradle Plugin does not run on the newest JDKs; 21 is what the
      # build is tested with (see tv/CLAUDE.md).
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Also validates gradle-wrapper.jar against Gradle's published checksums,
      # on top of the distributionSha256Sum pinned in gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint, release build
        run: ./gradlew --no-configuration-cache :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Sign release (tags only)
        if: startsWith(github.ref, 'refs/tags/tv-v')
        env:
          KEYSTORE_B64: ${{ secrets.PHIMNET_TV_KEYSTORE_B64 }}
          PHIMNET_TV_KEYSTORE_PASSWORD: ${{ secrets.PHIMNET_TV_KEYSTORE_PASSWORD }}
          PHIMNET_TV_KEY_ALIAS: ${{ secrets.PHIMNET_TV_KEY_ALIAS }}
          PHIMNET_TV_KEY_PASSWORD: ${{ secrets.PHIMNET_TV_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No signing secrets configured; the release APK stays unsigned."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          PHIMNET_TV_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew --no-configuration-cache :app:assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Keep the APK and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phimnet-tv-${{ github.sha }}
          path: |
            tv/app/build/outputs/apk/release/*.apk
            tv/app/build/reports/
          if-no-files-found: ignore
